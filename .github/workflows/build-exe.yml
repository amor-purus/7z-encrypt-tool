name: Build standalone Windows EXE

on:
  push:
    branches:
      - main
      - "release/**"
      - "maintenance/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Windows x64 EXE
    runs-on: windows-2025
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONHASHSEED: "0"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set reproducible build timestamp
        shell: pwsh
        run: |
          $epoch = (git show -s --format=%ct HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $epoch -notmatch '^\d+$') {
            throw "Could not resolve the source commit timestamp."
          }
          "SOURCE_DATE_EPOCH=$epoch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up build Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14.10"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install the locked build environment
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --upgrade "pip==26.3"
          python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps -r requirements-lock.txt
          python -m pip check
          python -m pip freeze --all

      - name: Compile application and tests
        run: python -m compileall -q main.py tests pyinstaller_hooks

      - name: Run source regression tests
        run: python -m unittest discover -s tests -v

      - name: Build single-file windowed EXE
        run: python -m PyInstaller --clean --noconfirm 7z-encrypt-tool.spec

      - name: Smoke-test the frozen EXE
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\7z-encrypt-tool.exe"
          if (-not (Test-Path $exe)) {
            throw "PyInstaller did not produce dist\7z-encrypt-tool.exe"
          }
          $report = Join-Path $env:RUNNER_TEMP "7z-encrypt-self-test.json"
          $process = Start-Process -FilePath $exe -ArgumentList @("--self-test", "--self-test-output", $report) -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            if (Test-Path $report) { Get-Content $report }
            throw "The frozen EXE self-test failed with exit code $($process.ExitCode)."
          }
          if (-not (Test-Path $report)) {
            throw "The frozen EXE did not write its self-test report."
          }
          Get-Content $report
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (
            -not $result.ok -or
            -not $result.encrypted_header -or
            -not $result.archive_round_trip -or
            -not $result.directory_archive -or
            -not $result.empty_directory_preserved
          ) {
            throw "The frozen EXE self-test report indicates a failed check."
          }

      - name: Prepare unsigned CI artifact for later release signing
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "dist\7z-encrypt-tool.exe" "release-assets\7z-encrypt-tool-windows-x64.exe"
          $version = (& python -c "import main; print(main.APP_VERSION)").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $version) {
            throw "Could not resolve the application version."
          }
          @"
          App version: $version
          Build Python: $(python --version)
          Pip: $(python -m pip --version)
          PyInstaller: $(python -m PyInstaller --version)
          Runner image: $env:ImageOS $env:ImageVersion
          Source commit: $env:GITHUB_SHA
          SOURCE_DATE_EPOCH: $env:SOURCE_DATE_EPOCH
          PYTHONHASHSEED: $env:PYTHONHASHSEED
          Authenticode: pending release-signing job (this CI artifact is unsigned)
          "@ | Set-Content "release-assets\BUILD-INFO.txt" -Encoding utf8
          python -m pip freeze --all | Set-Content "release-assets\DEPENDENCIES.txt" -Encoding utf8

      - name: Upload tested Windows build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: 7z-encrypt-tool-windows-x64-${{ github.sha }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

  sign:
    name: Sign and verify Windows x64 EXE
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/')
    needs: build
    runs-on: windows-2025
    environment: release-signing
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download tested Windows build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: 7z-encrypt-tool-windows-x64-${{ github.sha }}
          path: release-assets

      - name: Sign in to Azure using GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign EXE with Microsoft Artifact Signing
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\release-assets\7z-encrypt-tool-windows-x64.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify Authenticode signature and create final checksums
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "release-assets\7z-encrypt-tool-windows-x64.exe"
          $signature = Get-AuthenticodeSignature -FilePath $exe
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Authenticode verification failed: $($signature.Status) — $($signature.StatusMessage)"
          }
          if (-not $signature.SignerCertificate) {
            throw "The signed EXE has no signer certificate."
          }

          $buildInfoPath = Join-Path $PWD "release-assets\BUILD-INFO.txt"
          $buildInfo = Get-Content $buildInfoPath -Raw
          $buildInfo = $buildInfo -replace 'Authenticode: .*', "Authenticode: valid — $($signature.SignerCertificate.Subject)"
          Set-Content $buildInfoPath $buildInfo -Encoding utf8

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  7z-encrypt-tool-windows-x64.exe" | Set-Content "release-assets\SHA256SUMS.txt" -Encoding ascii
          Write-Host "Verified signer: $($signature.SignerCertificate.Subject)"
          Write-Host "SHA-256: $hash"

      - name: Upload signed release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-release-assets-${{ github.sha }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish signed GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/')
    needs:
      - build
      - sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download signed and verified release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: signed-release-assets-${{ github.sha }}
          path: release-assets

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            tag=$(printf '%s' "$GITHUB_REF_NAME" | sed 's|^release/||')
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [[ "$tag" != v* ]]; then
            echo "Refusing to publish a non-version tag: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Attach signed EXE to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 7z File Encryption Tool ${{ steps.release_tag.outputs.tag }}
          files: |
            release-assets/7z-encrypt-tool-windows-x64.exe
            release-assets/SHA256SUMS.txt
            release-assets/BUILD-INFO.txt
            release-assets/DEPENDENCIES.txt
          generate_release_notes: true
